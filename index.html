<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingeniería en Sistemas y Ciencia de Datos e IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="#inicio" class="logo" id="logo"></a>
      <nav class="nav" id="nav"></nav>
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
    </div>
  </header>

  <main>
    <section class="hero" id="inicio">
      <div class="hero-texto">
        <span class="saludo" id="heroSaludo"></span>
        <h1 id="heroTitulo"></h1>
        <p id="heroDescripcion"></p>
        <a href="#planes" class="btn" id="heroBoton"></a>
      </div>
      <div class="hero-imagen">
        <div class="hero-foto" id="heroFoto"></div>
        <span class="hero-nota" id="heroNota"></span>
      </div>
    </section>
        <!--planes de estudio-->>
    <section class="seccion" id="planes">
      <div class="contenedor planes-grid">
        <div class="seccion-intro">
          <span class="etiqueta" id="planesEtiqueta"></span>
          <h2 id="planesTitulo"></h2>
          <p id="planesDescripcion"></p>
        </div>
        <div class="tarjetas-carrera" id="planesTarjetas"></div>
      </div>
    </section>
        <!--oportunidades-->
    <section class="seccion seccion-alt" id="oportunidades">
      <div class="contenedor opor-grid">
        <div class="seccion-intro">
          <span class="etiqueta" id="oporEtiqueta"></span>
          <h2 id="oporTitulo"></h2>
          <p id="oporDescripcion"></p>
        </div>
        <div class="tarjetas-mini" id="oporTarjetas"></div>
      </div>
      <div class="contenedor">
        <div class="panel" id="oporPanel"></div>
      </div>
    </section>
        <!--equipos-->
    <section class="seccion" id="recursos">
      <div class="contenedor recursos-grid">
        <div class="seccion-intro">
          <span class="etiqueta" id="recEtiqueta"></span>
          <h2 id="recTitulo"></h2>
          <p id="recDescripcion"></p>
        </div>
        <div class="tarjetas-foto" id="recTarjetas"></div>
      </div>
    </section>
        <!--comunidad-->
    <section class="seccion seccion-alt" id="comunidad">
      <div class="contenedor comunidad-grid">
        <div class="seccion-intro">
          <span class="etiqueta" id="comEtiqueta"></span>
          <h2 id="comTitulo"></h2>
          <p id="comDescripcion"></p>
        </div>
        <div class="tarjetas-grupo" id="comTarjetas"></div>
      </div>
      <div class="contenedor">
        <div class="panel" id="comPanel"></div>
      </div>
    </section>
        <!--faq galeria-->
    <section class="seccion" id="galeria">
      <div class="contenedor faq-galeria">

        <div id="faq">
          <div class="seccion-intro">
            <span class="etiqueta" id="faqEtiqueta"></span>
            <h2 id="faqTitulo"></h2>
            <p id="faqDescripcion"></p>
          </div>
          <div class="faq-lista" id="faqLista"></div>
        </div>

        <div>
          <div class="seccion-intro">
            <span class="etiqueta" id="galEtiqueta"></span>
            <h2 id="galTitulo"></h2>
            <p id="galDescripcion"></p>
          </div>
          <div class="galeria-grid" id="galGrid"></div>
        </div>

      </div>
    </section>
  </main>
  <div class="lightbox" id="lightbox">
    <button class="lb-btn lb-cerrar" id="lbCerrar" aria-label="Cerrar">✕</button>
    <button class="lb-btn lb-anterior" id="lbAnterior" aria-label="Anterior">‹</button>
    <figure>
      <img id="lbImg" alt="">
      <figcaption id="lbTitulo"></figcaption>
    </figure>
    <button class="lb-btn lb-siguiente" id="lbSiguiente" aria-label="Siguiente">›</button>
  </div>

  <script src="contenido.js"></script>
  <script src="main.js"></script>
</body>
</html>
